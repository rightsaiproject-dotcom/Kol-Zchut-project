name: Daily Data Miner

on:
  schedule:
    - cron: '0 3 * * *' # מריץ כל יום ב-03:00
  workflow_dispatch:     # מאפשר לך להריץ ידנית בלחיצת כפתור בכל רגע

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 supabase anthropic python-dotenv

      - name: Run Miner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python data_miner.py